<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Инвентарь · ForteBank Video Review</title>
    <link rel="stylesheet" href="/static/inventory.css" />
    <script src="/static/inventory.js" defer></script>
  </head>
  <body>
    <div class="world" aria-hidden="true"></div>
    <div class="game-hud" aria-hidden="true"><div class="health"></div><div class="hunger"></div></div>
    <main class="stage" aria-label="Инвентарь проверки видео">
      <div id="inventory-layout" class="inventory-layout">
        <div id="recipe-panel-wrap" class="recipe-panel-wrap" hidden>
          <aside id="recipe-panel" class="recipe-panel" aria-label="Справочник">
            <button class="recipe-tab selected" type="button" style="top:0px" data-category="all" aria-label="Все действия"><img src="/static/minecraft-local/inventory/compass.png" alt="" /></button>
            <button class="recipe-tab" type="button" style="top:27px" data-category="video" aria-label="Видео"><img src="/static/minecraft-local/inventory/bricks.png" alt="" /></button>
            <button class="recipe-tab" type="button" style="top:54px" data-category="key" aria-label="Ключ"><img src="/static/minecraft-local/inventory/apple.png" alt="" /></button>
            <button class="recipe-tab" type="button" style="top:81px" data-category="other" aria-label="Остальное"><img src="/static/minecraft-local/inventory/redstone.png" alt="" /></button>
            <input id="recipe-search" class="recipe-search" type="search" placeholder="Поиск..." aria-label="Поиск по справочнику" autocomplete="off" />
            <button id="recipe-clear" class="recipe-clear" type="button" aria-label="Очистить поиск">×</button>
            <div id="recipe-grid" class="recipe-grid" aria-label="Действия"></div>
            <div id="recipe-instructions" class="recipe-instructions" aria-live="polite"></div>
          </aside>
        </div>
      <div id="inventory-wrap" class="inventory-wrap">
        <section id="inventory" class="inventory" aria-label="Инвентарь">
          <div id="craft-title" class="craft-title" data-mc-text>Создание</div>
          <img class="equipment-icon" style="left:8px;top:9px" src="/static/minecraft-local/inventory/helmet_slot.png" alt="" />
          <img class="equipment-icon" style="left:8px;top:27px" src="/static/minecraft-local/inventory/chestplate_slot.png" alt="" />
          <img class="equipment-icon" style="left:8px;top:45px" src="/static/minecraft-local/inventory/leggings_slot.png" alt="" />
          <img class="equipment-icon" style="left:8px;top:63px" src="/static/minecraft-local/inventory/boots_slot.png" alt="" />
          <img class="equipment-icon" style="left:77px;top:63px" src="/static/minecraft-local/inventory/shield_slot.png" alt="" />
          <div id="avatar" class="avatar" role="img" aria-label="Персонаж в фиолетовой одежде разворачивается за курсором"><div id="avatar-rig" class="avatar-rig" aria-hidden="true"></div></div>

          <button id="guide-button" class="recipe-toggle" style="left:104px;top:62px" type="button" aria-label="Открыть справочник" aria-expanded="false" data-tip="Книга знаний" data-detail="Открыть справочник"></button>

          <div id="craft-file" class="craft-item" style="left:97px;top:17px" aria-label="Файл для проверки не выбран"></div>
          <div id="craft-key" class="craft-item" style="left:115px;top:35px" aria-label="Ключ не добавлен"></div>
          <button id="craft-result" class="slot-button result-item" style="left:154px;top:27px" type="button" aria-label="Око Эндера" data-tip="Око Эндера" data-detail="Открыть следующий этап" hidden>
            <img src="/static/minecraft-local/inventory/ender_eye.png" alt="" />
          </button>

          <div class="hotbar" aria-label="Быстрый доступ">
            <span class="hotbar-reference" aria-hidden="true"></span>
            <button id="pearl-button" class="slot-button" style="left:8px;top:142px" type="button" aria-label="Эндер-жемчуг: выбрать файл" data-tip="Эндер-жемчуг" data-detail="Выбрать видеофайл .mov">
              <img src="/static/minecraft-local/inventory/ender_pearl.png" alt="" />
            </button>
            <button id="powder-button" class="slot-button" style="left:26px;top:142px" type="button" aria-label="Огненный порошок: добавить ключ" data-tip="Огненный порошок" data-detail="Добавить X-API ключ в создание">
              <img src="/static/minecraft-local/inventory/blaze_powder.png" alt="" />
            </button>
            <button id="rod-button" class="slot-button" style="left:44px;top:142px" type="button" aria-label="Огненный стержень: изменить ключ" data-tip="Огненный стержень" data-detail="Выбрать другой X-API ключ">
              <img src="/static/minecraft-local/inventory/blaze_rod.png" alt="" />
            </button>
            <button id="dragon-button" class="slot-button" style="left:62px;top:142px" type="button" aria-label="Голова дракона" data-tip="Голова дракона" data-detail="Назначение появится позже">
              <span class="dragon-icon" aria-hidden="true"><span class="dragon-eye"></span></span>
            </button>
            <button id="settings-button" class="slot-button" style="left:80px;top:142px" type="button" aria-label="Командный блок: настройки" data-tip="Командный блок" data-detail="Открыть настройки">
              <span class="command-icon" aria-hidden="true"><span class="command-top"></span><span class="command-left"></span><span class="command-front"></span></span>
            </button>
          </div>
        </section>
      </div>
      </div>
    </main>

    <input id="video-picker" class="visually-hidden" type="file" accept=".mov,video/quicktime" />
    <div id="item-tooltip" class="item-tooltip" role="tooltip" hidden>
      <div id="tooltip-name"></div>
    </div>

    <div id="modal-backdrop" class="modal-backdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title"></h2>
        <div id="modal-content"></div>
        <div id="modal-actions" class="modal-actions"></div>
      </section>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
