<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Инвентарь · ForteBank Video Review</title>
    <link rel="stylesheet" href="/static/inventory.css" />
    <link rel="stylesheet" href="/static/game-ui.css" />
    <script src="/static/game-ui.js" defer></script>
    <script src="/static/avatar.js" defer></script>
    <script src="/static/video-transfer.js" defer></script>
    <script src="/static/inventory.js" defer></script>
  </head>
  <body>
    <div class="world" aria-hidden="true"></div>
    <div class="game-hud" aria-hidden="true"><div class="health"></div><div class="hunger"></div></div>
    <main class="stage" aria-label="Инвентарь проверки видео">
      <div id="inventory-layout" class="inventory-layout">
        <div id="recipe-panel-wrap" class="recipe-panel-wrap" hidden>
          <aside id="recipe-panel" class="recipe-panel" aria-label="Справочник">
            <button class="recipe-tab selected" type="button" style="top:0px" data-category="all" aria-label="Все действия"><span class="recipe-tab-content"><img class="item-icon" data-item="compass" src="/static/minecraft-local/inventory/items/compass.png" alt="" /></span></button>
            <button class="recipe-tab" type="button" style="top:27px" data-category="video" aria-label="Видео"><span class="recipe-tab-content"><img class="item-icon" data-item="bricks" src="/static/minecraft-local/inventory/items/bricks.png" alt="" /></span></button>
            <button class="recipe-tab" type="button" style="top:54px" data-category="key" aria-label="Ключ"><span class="recipe-tab-content"><span class="recipe-tab-pair"><img class="item-icon" data-item="lava_bucket" src="/static/minecraft-local/inventory/items/lava_bucket.png" alt="" /><img class="item-icon" data-item="apple" src="/static/minecraft-local/inventory/items/apple.png" alt="" /></span></span></button>
            <button class="recipe-tab" type="button" style="top:81px" data-category="other" aria-label="Остальное"><span class="recipe-tab-content"><img class="item-icon" data-item="redstone" src="/static/minecraft-local/inventory/items/redstone.png" alt="" /></span></button>
            <input id="recipe-search" class="recipe-search" type="search" placeholder="Search..." aria-label="Поиск по справочнику" autocomplete="off" />
            <button id="recipe-filter" class="recipe-filter enabled" type="button" aria-label="Показать все действия" aria-pressed="true"></button>
            <div id="recipe-grid" class="recipe-grid" aria-label="Действия"></div>
            <div id="recipe-instructions" class="recipe-instructions" aria-live="polite"></div>
          </aside>
        </div>
      <div id="inventory-wrap" class="inventory-wrap">
        <section id="inventory" class="inventory" aria-label="Инвентарь">
          <div id="craft-title" class="craft-title" data-mc-text>Создание</div>
          <img class="equipment-icon" style="left:8px;top:8px" src="/static/minecraft-local/inventory/helmet_slot.png" alt="" />
          <img class="equipment-icon" style="left:8px;top:26px" src="/static/minecraft-local/inventory/chestplate_slot.png" alt="" />
          <img class="equipment-icon" style="left:8px;top:44px" src="/static/minecraft-local/inventory/leggings_slot.png" alt="" />
          <img class="equipment-icon" style="left:8px;top:62px" src="/static/minecraft-local/inventory/boots_slot.png" alt="" />
          <img class="equipment-icon" style="left:77px;top:62px" src="/static/minecraft-local/inventory/shield_slot.png" alt="" />
          <div id="avatar" class="avatar" role="img" aria-label="Персонаж в фиолетовой одежде DS поворачивается целиком за курсором"><div class="avatar-fallback" aria-hidden="true"></div><canvas aria-hidden="true"></canvas></div>

          <button id="guide-button" class="recipe-toggle" style="left:104px;top:62px" type="button" aria-label="Открыть справочник" aria-expanded="false" data-tip="Книга знаний" data-detail="Открыть справочник"></button>

          <div id="craft-file" class="craft-item" style="left:97px;top:17px" aria-label="Файл для проверки не выбран"></div>
          <div id="craft-key" class="craft-item" style="left:115px;top:35px" aria-label="Ключ не добавлен"></div>
          <button id="craft-result" class="slot-button result-item" style="left:153px;top:27px" type="button" aria-label="Око Эндера" data-tip="Око Эндера" data-detail="Перейти в Энд — проверить видео" hidden>
            <img class="item-icon" data-item="ender_eye" src="/static/minecraft-local/inventory/items/ender_eye.png" alt="" />
          </button>

          <div class="hotbar" aria-label="Быстрый доступ">
            <span id="hotbar-selection" class="hotbar-selection" aria-hidden="true" hidden></span>
            <button id="pearl-button" class="slot-button" style="left:7px;top:141px" type="button" aria-label="Эндер-жемчуг: выбрать файл" data-tip="Эндер-жемчуг" data-detail="Выбрать видеофайл .mov">
              <img class="item-icon" data-item="ender_pearl" src="/static/minecraft-local/inventory/items/ender_pearl.png" alt="" />
            </button>
            <button id="powder-button" class="slot-button" style="left:25px;top:141px" type="button" aria-label="Огненный порошок: добавить ключ" data-tip="Огненный порошок" data-detail="Добавить X-API ключ в создание">
              <img class="item-icon" data-item="blaze_powder" src="/static/minecraft-local/inventory/items/blaze_powder.png" alt="" />
            </button>
            <button id="rod-button" class="slot-button" style="left:43px;top:141px" type="button" aria-label="Огненный стержень: изменить ключ" data-tip="Огненный стержень" data-detail="Выбрать другой X-API ключ">
              <img class="item-icon" data-item="blaze_rod" src="/static/minecraft-local/inventory/items/blaze_rod.png" alt="" />
            </button>
            <button id="dragon-button" class="slot-button" style="left:61px;top:141px" type="button" aria-label="Голова дракона" data-tip="Голова дракона" data-detail="Назначение появится позже">
              <img class="item-icon" data-item="dragon_head" src="/static/minecraft-local/inventory/items/dragon_head.png" alt="" />
            </button>
            <button id="settings-button" class="slot-button" style="left:79px;top:141px" type="button" aria-label="Командный блок: настройки" data-tip="Командный блок" data-detail="Открыть настройки">
              <img class="item-icon" data-item="command_block" src="/static/minecraft-local/inventory/items/command_block.png" alt="" />
            </button>
          </div>
          <span id="selected-slot-announcement" class="visually-hidden" role="status"></span>
        </section>
      </div>
      </div>
    </main>

    <input id="video-picker" class="visually-hidden" type="file" accept=".mov,video/quicktime" />
    <div id="item-tooltip" class="item-tooltip" role="tooltip" hidden>
      <div id="tooltip-name"></div>
    </div>

    <div id="modal-backdrop" class="modal-backdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title"></h2>
        <div id="modal-content"></div>
        <div id="modal-actions" class="modal-actions"></div>
      </section>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
