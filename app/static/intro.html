<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>По ключу · ForteBank Video Review</title>
    <link rel="stylesheet" href="/static/intro.css" />
    <link rel="stylesheet" href="/static/game-ui.css" />
    <script src="/static/game-ui.js" defer></script>
    <script src="/static/intro.js" defer></script>
  </head>
  <body>
    <div class="world" aria-hidden="true">
      <canvas id="panorama-canvas" class="world-canvas"></canvas>
      <div class="world-shade"></div>
    </div>

    <main class="screen">
      <section id="connect-screen" class="connect-screen" aria-labelledby="connect-title">
        <h1 id="connect-title" data-minecraft-text>По ключу</h1>
        <form id="connect-form" class="connect-form">
          <label for="intro-key" data-minecraft-text>X-API ключ</label>
          <div class="key-field">
            <input id="intro-key" name="key" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="256" />
            <div id="key-visual" class="key-visual" aria-hidden="true">
              <span id="key-render" data-minecraft-scale="2"></span><span id="key-cursor" class="key-cursor"></span>
            </div>
          </div>
          <div class="actions">
            <button id="connect-button" class="pixel-button" type="submit" data-minecraft-text>Подключиться</button>
            <button id="cancel-button" class="pixel-button" type="button" data-minecraft-text>Отмена</button>
          </div>
        </form>
      </section>

      <section id="checking-screen" class="status-screen" aria-live="polite" hidden>
        <p data-minecraft-text data-minecraft-scale="1.5">Подключение к серверу...</p>
        <button id="checking-cancel" class="pixel-button" type="button" data-minecraft-text data-minecraft-scale="1.5">Отмена</button>
      </section>

      <section id="loading-screen" class="status-screen" aria-live="polite" hidden>
        <div class="loading-content">
          <p data-minecraft-text data-minecraft-scale="1.5">Загрузка сайта...</p>
          <div class="load-track"><div id="load-progress" class="load-progress"></div></div>
          <canvas id="world-build" class="world-build" width="104" height="104" role="img" aria-label="Карта загрузки участков мира"></canvas>
        </div>
      </section>

      <section id="failure-screen" class="status-screen failure-screen" aria-live="assertive" hidden>
        <p data-minecraft-text data-minecraft-scale="1.5">Не удалось подключиться к серверу</p>
        <p id="failure-reason" data-minecraft-text data-minecraft-scale="1.5">Неверный X-API ключ</p>
        <button id="failure-back" class="pixel-button" type="button" data-minecraft-text data-minecraft-scale="1.5">К вводу ключа</button>
      </section>

      <section id="menu-screen" class="menu-screen" aria-labelledby="menu-title" hidden>
        <div class="menu-heading">
          <p class="menu-kicker" data-minecraft-text data-minecraft-scale="3">FORTEBANK</p>
          <h2 id="menu-title" data-minecraft-text data-minecraft-scale="2.5">VIDEO REVIEW</h2>
        </div>
        <button id="menu-connect-button" class="pixel-button" type="button" data-minecraft-text>По ключу</button>
      </section>
    </main>
  </body>
</html>
